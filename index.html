<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LOS CUATES - Tamales en Hoja de Plátano</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E2F5E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
:root{--marfil:#FFFCF2;--crema:#E9E0C9;--azul:#1E2F5E;--dorado:#B9975B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--marfil);position:relative;overflow-x:hidden}
#sarape{position:fixed;inset:0;z-index:-2;opacity:0.11;background-image:url('sarape.webp');background-size:420px;pointer-events:none}
#watermark{position:fixed;inset:0;z-index:-1;opacity:0.11;background-image:url('los_cuates_logo.webp');background-position:center 18%;background-size:78%;background-repeat:no-repeat;pointer-events:none}
.container{max-width:480px;margin:0 auto;padding:20px 16px 110px;position:relative;z-index:1}
.header{text-align:center;padding:20px 0 10px}
.logo{width:220px;border-radius:22px;box-shadow:0 8px 32px rgba(0,0,0,.08);border:1px solid var(--crema)}
.brand{font-family:'Cormorant Garamond';font-size:58px;font-weight:700;color:var(--azul);letter-spacing:.06em;line-height:.9;margin-top:12px}
.sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6B7A4F;margin-top:8px}
.addr{font-size:11px;color:#9A8F7A;margin-top:6px}
.badge-wa{display:inline-block;margin-top:10px;background:var(--azul);color:#fff;padding:6px 14px;border-radius:999px;font-size:11px}
.card{background:#fff;border:1px solid var(--crema);border-radius:26px;padding:20px;margin-top:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.card-title{font-family:'Cormorant Garamond';font-size:28px;color:var(--azul);font-weight:700}
#map{height:280px;border-radius:16px;margin-top:12px;border:1px solid var(--crema);z-index:1}
.btn{width:100%;padding:13px;border-radius:999px;border:none;font-weight:600;cursor:pointer}
.btn-primary{background:var(--azul);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--crema);color:var(--azul);padding:10px;font-size:12px}
.menu-item{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F5EEDD}
.menu-name{font-family:'Cormorant Garamond';font-size:22px;font-weight:600;color:var(--azul)}
.price{font-family:'Cormorant Garamond';font-size:22px;color:var(--dorado);font-weight:700}
.qty{display:flex;gap:8px;align-items:center;margin-top:8px}
.qty button{width:30px;height:30px;border-radius:999px;border:1px solid var(--crema);background:#fff;cursor:pointer}
.input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--crema);margin-top:6px}
.cart{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,252,242,.94);backdrop-filter:blur(10px);border-top:1px solid var(--crema);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.qr-box{margin-top:12px;padding:12px;background:#FFFEFB;border:1px dashed var(--crema);border-radius:16px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#fff;border-radius:24px;padding:20px;max-width:320px;width:100%;text-align:center}
</style>
 </head>
 <body>
  <div id="sarape"></div>
  <div id="watermark"></div>
  <div class="container">
   <div class="header">
    <img class="logo" src="los_cuates_logo.webp" alt="Los Cuates">
    <div class="brand">LOS CUATES</div>
    <div class="sub">Tamales en Hoja de Plátano — Saltillo</div>
    <div class="addr">Calle Chihuahua con Candela, República Poniente, Saltillo</div>
    <div class="badge-wa">Pedidos al WhatsApp 844-225-2582</div>
   </div>
   <div class="card">
    <div class="card-title" style="font-size:22px">Ubicación y Entregas</div>
    <div id="map"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
     <button class="btn btn-outline" onclick="fijarPuesto()">📌 Fijar mi puesto</button>
     <button class="btn btn-outline" onclick="fijarCliente()">📍 Mi ubicación</button>
    </div>
    <div id="locInfo" style="font-size:10px;color:#9A8F7A;margin-top:8px">Puesto: 25.436413, -100.998999</div>
    <button class="btn btn-outline" style="margin-top:8px" onclick="ruta()">🧭 Ruta Google Maps</button>
   </div>
   <div class="card">
    <div class="card-title">Nuestra Selección</div>
    <div id="menu"></div>
   </div>
   <div class="card" id="checkout">
    <div class="card-title" style="font-size:22px">Tu Pedido</div>
    <div id="summary" style="font-size:12px;margin-top:8px">Aún no agregas tamales</div>
    <label style="font-size:10px;margin-top:12px;display:block">Nombre</label><input id="nombre" class="input" placeholder="Ana"> <label style="font-size:10px;margin-top:8px;display:block">Entrega</label><select id="entrega" class="input"><option>A domicilio</option><option>Recoger en puesto</option></select> <label style="font-size:10px;margin-top:8px;display:block">Dirección</label><input id="dir" class="input" placeholder="Colonia, referencia">
    <button class="btn btn-primary" style="margin-top:14px" onclick="enviarWhatsApp()">Enviar por WhatsApp → 844-225-2582</button>
    <div id="qrPedidoBox" class="qr-box" style="display:none">
     <img id="qrPedidoImg" src="" style="width:160px">
     <div id="folioText" style="font-size:11px;font-weight:700;margin-top:6px"></div>
    </div>
   </div>
   <div class="card">
    <div style="font-size:11px;font-weight:600">QR DE TU PUESTO</div>
    <div class="qr-box">
     <img id="qrPuestoImg" src="" style="width:140px">
    </div>
   </div>
  </div>
  <div class="cart">
   <div>
    <div id="cCount" style="font-weight:700;color:#1E2F5E">0 tamales</div>
    <div id="cTotal" style="font-family:'Cormorant Garamond';font-size:20px;color:#B9975B">$0</div>
   </div>
   <button class="btn btn-primary" style="width:auto;padding:10px 18px" onclick="document.getElementById('checkout').scrollIntoView({behavior:'smooth'})">Pedir</button>
  </div>
  <div id="modal" class="modal" onclick="this.style.display='none'">
   <div class="modal-content">
    <div id="modalText"></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="document.getElementById('modal').style.display='none'">Entendido</button>
   </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
const sabores=[{id:1,nombre:'Queso',desc:'Rajas con Oaxaca fundido',precio:35},{id:2,nombre:'Verde de Pollo',desc:'Pollo en salsa verde tatemada',precio:35},{id:3,nombre:'Rojo de Puerco',desc:'Puerco en chile guajillo',precio:35}];
let cart={},rest={lat:25.436413,lng:-100.998999},cust=null,map,rMarker,cMarker,modo='rest';
function showModal(t){document.getElementById('modalText').innerText=t;document.getElementById('modal').style.display='flex';}
function renderMenu(){document.getElementById('menu').innerHTML=sabores.map(s=>`<div class="menu-item"><div><div class="menu-name">${s.nombre}</div><div style="font-size:11px;color:#7D7768">${s.desc}</div><div class="qty"><button onclick="chg(${s.id},-1)">−</button><span id="q${s.id}">${cart[s.id]||0}</span><button onclick="chg(${s.id},1)">+</button></div></div><div class="price">$35</div></div>`).join('');}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];document.getElementById('q'+id).innerText=cart[id]||0;upd();}
function upd(){let t=0,c=0,lines=[];for(let id in cart){let s=sabores.find(x=>x.id==id);t+=s.precio*cart[id];c+=cart[id];lines.push(`${cart[id]}x ${s.nombre}`);}document.getElementById('cCount').innerText=`${c} tamales`;document.getElementById('cTotal').innerText=`$${t}`;document.getElementById('summary').innerHTML=c?lines.join('<br>')+`<br><b>Total $${t}</b>`:'Aún no agregas tamales';}
function initMap(){try{if(typeof L==='undefined'){document.getElementById('map').innerHTML='<div style="padding:40px;text-align:center;font-size:12px">Mapa offline - en APK con internet carga</div>';return;}map=L.map('map').setView([rest.lat,rest.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);rMarker=L.marker([rest.lat,rest.lng]).addTo(map).bindPopup('LOS CUATES - Chihuahua con Candela');map.on('click',e=>{if(modo==='rest'){rest.lat=e.latlng.lat;rest.lng=e.latlng.lng;rMarker.setLatLng([rest.lat,rest.lng]);document.getElementById('locInfo').innerText=`Puesto manual: ${rest.lat.toFixed(5)}, ${rest.lng.toFixed(5)}`;}else{cust={lat:e.latlng.lat,lng:e.latlng.lng};if(!cMarker)cMarker=L.marker([cust.lat,cust.lng]).addTo(map);else cMarker.setLatLng([cust.lat,cust.lng]);document.getElementById('dir').value=`GPS ${cust.lat.toFixed(5)}, ${cust.lng.toFixed(5)}`;}});qrPuesto();}catch(e){console.log(e);}}
function fijarPuesto(){modo='rest';if(!navigator.geolocation){showModal('Toca el mapa para fijar tu puesto');return;}navigator.geolocation.getCurrentPosition(p=>{rest={lat:p.coords.latitude,lng:p.coords.longitude};rMarker.setLatLng([rest.lat,rest.lng]);map.setView([rest.lat,rest.lng],16);},err=>{showModal(err.code===1?'Permiso denegado: Activa ubicación en Ajustes o toca el mapa':'GPS sin señal, toca el mapa');},{enableHighAccuracy:true,timeout:12000});}
function fijarCliente(){modo='cust';if(!navigator.geolocation){showModal('Toca el mapa donde vive el cliente');return;}navigator.geolocation.getCurrentPosition(p=>{cust={lat:p.coords.latitude,lng:p.coords.longitude};if(!cMarker)cMarker=L.marker([cust.lat,cust.lng]).addTo(map);else cMarker.setLatLng([cust.lat,cust.lng]);document.getElementById('dir').value=`GPS ${cust.lat.toFixed(5)}, ${cust.lng.toFixed(5)}`;map.fitBounds([[rest.lat,rest.lng],[cust.lat,cust.lng]],{padding:[30,30]});},err=>{showModal('No se pudo obtener ubicación en vivo. Toca el mapa para fijar manual');});}
function ruta(){if(!cust){showModal('Fija ubicación del cliente primero');return;}window.open(`https://www.google.com/maps/dir/?api=1&origin=${rest.lat},${rest.lng}&destination=${cust.lat},${cust.lng}`,'_blank');}
function qrPuesto(){document.getElementById('qrPuestoImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(location.href)}`;}
function enviarWhatsApp(){let t=0,c=0,det=[];for(let id in cart){let s=sabores.find(x=>x.id==id);t+=s.precio*cart[id];c+=cart[id];det.push(`- ${cart[id]}x ${s.nombre} ($${s.precio*cart[id]})`);}if(c===0){showModal('Agrega tamales');return;}const nom=document.getElementById('nombre').value||'Cliente';const ent=document.getElementById('entrega').value;const dir=document.getElementById('dir').value;const folio='CUATES-'+Math.floor(1000+Math.random()*9000);let msg=`Hola LOS CUATES! Soy ${nom}%0AQuiero:%0A${det.join('%0A')}%0ATotal: $${t} (${c} tamales a $35)%0AEntrega: ${ent} - ${dir}%0AFolio: ${folio}`;if(cust)msg+=`%0AUbic: https://www.google.com/maps?q=${cust.lat},${cust.lng}`;window.open(`https://wa.me/528442252582?text=${msg}`,'_blank');document.getElementById('qrPedidoBox').style.display='block';document.getElementById('qrPedidoImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(folio+' - '+nom)}`;document.getElementById('folioText').innerText=folio;}
window.onload=()=>{renderMenu();upd();setTimeout(initMap,500);}
</script>
 </body>
</html>
